experiment_id: "E1"
name: "Architecture Value"
description: "Compare fair C0, strong deterministic rule_engine, single-agent LLM C1, and multi-agent LLM C2 under identical models, tools, and budgets across held_out and challenge slices."
split: "held_out"
include_challenge_slice: true
repeats: 3
modes:
  - "c0_fixed"
  - "rule_engine"
  - "c1_single"
  - "c2_multi"
budgets:
  max_tool_calls: 15
  max_cost_usd_per_case: 0.15
  max_replans: 3
defenses_enabled: true
reflexion_enabled: false
memory_enabled: true
metrics:
  - "disposition_accuracy"
  - "macro_f1"
  - "weighted_error_cost"
  - "false_close_rate"
  - "evidence_recall"
  - "evidence_precision"
  - "replan_recovery_rate"
  - "needless_replan_rate"
  - "inr_arithmetic_error_rate"
  - "citation_validity_rate"
  - "cost_usd"
  - "tokens"
  - "latency_s"
  - "tool_calls"
  - "tool_error_rate"
