config_version: "2.0.0"

# Every model slug the system may use. Runtime selection (env or admin API) is validated against this list.
allowed_models:
  - openai/gpt-6-luna
  - openai/gpt-5-mini
  - openai/gpt-5-nano
  - openai/gpt-5.4-nano
  - openai/gpt-4.1-mini
  - openai/gpt-4.1-nano
  - openai/gpt-4o-mini
  - openai/gpt-oss-120b
  - anthropic/claude-haiku-5.5
  - anthropic/claude-3-haiku
  - google/gemini-3.1-flash-lite
  - google/gemma-4-31b-it
  - qwen/qwen3.7-plus
  - qwen/qwen3.6-plus
  - qwen/qwen3.8-27b
  - qwen/qwen3.5-35b-a3b
  - qwen/qwen3.5-9b
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-chat
  - z-ai/glm-5.3
  - z-ai/glm-5.3-flash
  - meta-llama/llama-3.3-70b-instruct
  - meta-llama/llama-3.1-70b-instruct
  - meta-llama/llama-3.1-8b-instruct
  - amazon/nova-lite-v1

models:
  c1_investigator:
    provider: "openrouter"
    model_id: "openai/gpt-5-mini"
    temperature: "0.1"
    max_tokens: 2048
  c2_supervisor:
    provider: "openrouter"
    model_id: "openai/gpt-5-mini"
    temperature: "0.1"
    max_tokens: 2048
  c2_specialists:
    provider: "openrouter"
    model_id: "openai/gpt-5-mini"
    temperature: "0.1"
    max_tokens: 1536
  judge:
    provider: "openrouter"
    model_id: "google/gemini-3.1-flash-lite"
    temperature: "0.0"
    max_tokens: 1024

# Per-million-token USD prices used for deterministic cost accounting (`default` applies to unlisted models).
pricing:
  default:
    input_per_million_usd: "0.40"
    output_per_million_usd: "1.60"

budgets:
  max_tool_calls: 15
  max_replans: 3
  max_critique_retries: 2
  max_cost_usd_per_case: "0.15"

timeouts:
  mcp_call_seconds: 20
  llm_call_seconds: 60

graph_bounds:
  time_window_days:
    min: 1
    max: 30
    default: 7
  max_hops:
    min: 2
    max: 5
    default: 3
  amount_tolerance:
    min: "0.01"
    max: "0.25"
    default: "0.10"
  min_intermediaries:
    min: 2
    max: 10
    default: 2

graph_limits:
  max_raw_paths: 50
  max_paths_returned: 20
  anchor_lookback_days: 1

suspicion:
  scatter_gather_min_nodes: 3
  rapid_layering_max_days: 7
  rapid_layering_min_nodes: 4
  fee_skim_min_ratio: "0.05"

structuring:
  threshold_inr: "1000000.00"
  floor_inr: "800000.00"

memory:
  short_term_window_messages: 12

retrieval:
  embedding_model: "BAAI/bge-m3"
  reranker_model: "BAAI/bge-reranker-base"
  rrf_k: 60
  top_k_dense: 20
  top_k_bm25: 20
  top_k_final: 5
