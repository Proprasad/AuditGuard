config_version: "2.0.0"

# Every model slug the system may use. Runtime selection (env or admin API) is validated against this list.
allowed_models:
  - openai/gpt-6-luna
  - openai/gpt-5-mini
  - openai/gpt-5-nano
  - openai/gpt-5.4-nano
  - openai/gpt-4.1-mini
  - openai/gpt-4.1-nano
  - openai/gpt-4o-mini
  - openai/gpt-oss-120b
  - anthropic/claude-haiku-5.5
  - anthropic/claude-3-haiku
  - google/gemini-3.1-flash-lite
  - google/gemma-4-31b-it
  - qwen/qwen3.7-plus
  - qwen/qwen3.6-plus
  - qwen/qwen3.8-27b
  - qwen/qwen3.5-35b-a3b
  - qwen/qwen3.5-9b
  - deepseek/deepseek-v4-flash
  - deepseek/deepseek-chat
  - z-ai/glm-5.3
  - z-ai/glm-5.3-flash
  - meta-llama/llama-3.3-70b-instruct
  - meta-llama/llama-3.1-70b-instruct
  - meta-llama/llama-3.1-8b-instruct
  - amazon/nova-lite-v1

models:
  c1_investigator:
    provider: "openrouter"
    model_id: "openai/gpt-5-mini"
    temperature: "0.1"
    max_tokens: 2048
    reasoning_effort: "low"
  c2_supervisor:
    provider: "openrouter"
    model_id: "openai/gpt-5-mini"
    temperature: "0.1"
    max_tokens: 2048
    reasoning_effort: "low"
  c2_specialists:
    provider: "openrouter"
    model_id: "openai/gpt-5-mini"
    temperature: "0.1"
    max_tokens: 1536
    reasoning_effort: "low"
  judge:
    provider: "openrouter"
    model_id: "google/gemini-3.1-flash-lite"
    temperature: "0.0"
    max_tokens: 1024

# Per-million-token USD prices used for deterministic cost accounting (`default` applies to unlisted models).
pricing:
  default:
    input_per_million_usd: "0.40"
    output_per_million_usd: "1.60"

budgets:
  max_tool_calls: 15
  max_replans: 3
  max_critique_retries: 2
  max_cost_usd_per_case: "0.15"

timeouts:
  mcp_call_seconds: 20
  llm_call_seconds: 60
  sse_stream_seconds: 600
  sse_poll_interval_seconds: "0.4"

graph_bounds:
  time_window_days:
    min: 1
    max: 30
    default: 7
  max_hops:
    min: 2
    max: 5
    default: 3
  amount_tolerance:
    min: "0.01"
    max: "0.25"
    default: "0.10"
  min_intermediaries:
    min: 2
    max: 10
    default: 2

graph_limits:
  max_raw_paths: 50
  max_paths_returned: 20
  anchor_lookback_days: 1

suspicion:
  scatter_gather_min_nodes: 3
  rapid_layering_max_days: 7
  rapid_layering_min_nodes: 4
  fee_skim_min_ratio: "0.05"

structuring:
  threshold_inr: "1000000.00"
  floor_inr: "800000.00"

# Evidence-weighted rubric used when no live LLM scores the competing hypotheses (offline mode). Weights move the
# suspicious-typology confidence away from `prior`; the benign confidence is its complement. Nothing here is per-case.
scoring:
  prior: "0.50"
  min_confidence: "0.05"
  max_confidence: "0.95"
  disposition_threshold: "0.70"
  request_info_floor: "0.45"
  no_multi_hop_margin: "0.05"
  c0_escalate_confidence: "0.68"
  c0_request_info_confidence: "0.40"
  suspicious_weights:
    multi_hop_path: "0.15"
    flagged_path: "0.10"
    income_mismatch: "0.10"
    high_kyc_risk: "0.10"
    unregistered_root: "0.10"
  benign_weights:
    registered_root: "0.30"
    verified_merchants_low_risk: "0.25"
    low_kyc_risk: "0.10"

memory:
  short_term_window_messages: 12
  # Live LLM context (C1 loop, C2 specialists): trimmed only beyond this many messages; the system prompt and the
  # alert stay pinned and evicted turns are summarised (audit AG-11).
  live_context_window_messages: 40
  # Prior human-approved episodes of the alert's own customer shown to the agent (audit AG-05).
  subject_history_max_episodes: 3

# Reflexion lessons are offered only when their precondition matches the observed case features (audit AG-06).
lesson_retrieval:
  top_k: 2
  min_overlap: 3

retrieval:
  # builtin = hand-built SVD dense + weighted reranker (default, no extra deps);
  # neural  = sentence-transformers bi-encoder + cross-encoder (needs the [rag] extra; falls back to builtin).
  backend: "builtin"
  embedding_model: "BAAI/bge-small-en-v1.5"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  embedding_query_prefix: "Represent this sentence for searching relevant passages: "
  # sha256 of compliance_kb DOMAIN_CONCEPTS + stopwords. A test fails if the hand-written synonym table changes
  # without re-measuring retrieval and updating this value (audit AG-08).
  expansion_table_sha256: "ec1609946ec366bbfbbc8766ebaadff485d44d9c84f42ca194d3dd9b991f49ce"
  rrf_k: 60
  top_k_dense: 20
  top_k_bm25: 20
  top_k_final: 5
  bm25_k1: "1.5"
  bm25_b: "0.75"
  dense_blend:
    svd: "0.40"
    subword: "0.60"
  # Final hybrid score = weighted sum of normalised signals (+ id_hit when the query names the clause id).
  rerank_weights:
    rrf: "0.35"
    bm25: "0.25"
    dense: "0.20"
    coverage: "0.10"
    bigram: "0.06"
    title: "0.04"
    id_hit: "0.35"
  # Length-normalised abstention thresholds (general IR signals; no query-specific rules).
  abstention:
    bm25_min: "10.5"
    bm25_soft_min: "9.5"
    bm25_per_token: "1.15"
    dense_min: "0.44"
    coverage_min: "0.34"
    term_hit_min: 2
    short_query_bm25_min: "4.5"
    short_query_dense_min: "0.30"
    low_term_dense_min: "0.48"

agent_limits:
  c1_max_turns: 12
  c2_specialist_max_turns: 4
  c2_replan_handoff_budget: 2
  c2_replan_max_turns: 2

approval:
  token_ttl_seconds: 900

# Reflexion reflector call (model = c1_investigator unless overridden).
reflector:
  temperature: "0.1"
  max_tokens: 512

# Cut-offs that choose the case-specific regulatory search query from reconstructed paths.
query_typology:
  multi_tier_min_hops: 4
  fee_skim_min_retention_pct: "5.0"
  staggered_min_span_days: 10
