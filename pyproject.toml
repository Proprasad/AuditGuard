[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditguard"
version = "0.3.0"
description = "Evidence-Grounded AI Investigation System for Ambiguous Fund-Flow Networks"
requires-python = ">=3.10"
dependencies = [
    # Core API, validation, graph math, MCP, observability
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "networkx>=3.3",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "PyYAML>=6.0.1",
    # Real graph runtime + durable checkpointing (always installed)
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "aiosqlite>=0.20.0",
    "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
llm = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
]
rag = [
    "qdrant-client>=1.11.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
]
ui = [
    "chainlit>=2.0.0",
]
observability = [
    "langfuse>=3.0.0",
    "opentelemetry-api>=1.26.0",
    "opentelemetry-sdk>=1.26.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.0",
]
full = [
    "auditguard[llm,rag,ui,observability,dev]",
]

[project.scripts]
auditguard = "src.cli:app"

[tool.setuptools.packages.find]
include = ["src*", "data*", "eval*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "DTZ", "BLE", "T20", "C901"]
ignore = ["E501", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "C901", "B011"]
"eval/*" = ["S", "T20"]
"data/*" = ["S", "T20"]
"scripts/*" = ["S", "T20", "C901"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
