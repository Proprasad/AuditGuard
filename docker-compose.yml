version: "3.9"

services:
  # ---- Infrastructure ----
  postgres:
    image: postgres:16-alpine
    container_name: auditguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auditguard
      POSTGRES_USER: auditguard
      POSTGRES_PASSWORD: auditguard_secret
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: auditguard_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MCP Servers ----
  mcp-compliance-kb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_compliance_kb
    command: python -m src.mcp_servers.compliance_kb
    env_file: .env
    ports:
      - "8010:8010"
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  mcp-graph-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_graph_engine
    command: python -m src.mcp_servers.graph_engine
    env_file: .env
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-bank-records:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_bank_records
    command: python -m src.mcp_servers.bank_records
    env_file: .env
    ports:
      - "8012:8012"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-case-actions:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_case_actions
    command: python -m src.mcp_servers.case_actions
    env_file: .env
    ports:
      - "8013:8013"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---- Core Application ----
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditguard_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auditguard_ui
    command: chainlit run src/ui/app.py --host 0.0.0.0 --port 8001
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - api
    restart: unless-stopped

  # ---- Observability ----
  langfuse:
    image: langfuse/langfuse:latest
    container_name: auditguard_langfuse
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://auditguard:auditguard_secret@postgres:5432/langfuse
      NEXTAUTH_SECRET: change-me-nextauth
      SALT: change-me-salt
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: auditguard_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: auditguard_prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: auditguard_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: auditguard
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  grafana_data:
