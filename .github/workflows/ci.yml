name: AuditGuard CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-and-eval-gate:
    runs-on: ubuntu-latest
    env:
      ANALYST_PASSWORD: "ci-analyst-password-0001"
      REVIEWER_PASSWORD: "ci-reviewer-password-0002"
      ADMIN_PASSWORD: "ci-admin-password-0003"
      API_SECRET_KEY: "ci-ephemeral-jwt-secret-0123456789abcdef0123456789abcdef"
      HMAC_SECRET: "ci-ephemeral-hmac-secret-0123456789abcdef0123456789abcdef"
      AUTH_REQUIRED: "true"
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,dev]" fastmcp prometheus-client uvicorn pytest-asyncio
      - name: Generate deterministic datasets (v1 + golden_v2 + red_team_v2)
        run: |
          python -m data.synthetic_generator
          python -m data.generator_v2.build --seed 42
          python -m eval.build_red_team_v2
      - name: Run full verification gate (make verify)
        run: make verify
      - name: Dev-split accuracy floor (offline, deterministic; every non-C0 mode must reach 45%)
        run: make eval-gate
